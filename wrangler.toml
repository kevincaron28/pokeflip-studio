# Cloudflare Pages project for Cardstead (the move off Vercel Hobby: docs/CLOUDFLARE-MOVE.md).
# Build command: node tools/build-pages.mjs   Output directory: dist   Root directory: (repository root)
# Secrets (EBAY_CLIENT_ID, EBAY_CLIENT_SECRET) are set in the Cloudflare dashboard, never here.
name = "cardstead"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

# Plain variables (the dashboard only takes secrets for this project).
[vars]
# Shows the price-alert choice in Settings: the daily price-alert job runs (docs/DROPS-PUSH.md).
PRICE_ALERTS = "1"
