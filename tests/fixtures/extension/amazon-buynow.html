<!doctype html><html><head><title>Test product</title></head><body>
<span id="productTitle"> Pokémon TCG: Surging Sparks Elite Trainer Box </span>
<div id="corePrice_feature_div"><span class="a-price"><span class="a-offscreen">$64.99</span></span></div>
<div id="availability"><span>In Stock</span></div>
<div id="merchantInfoFeature_feature_div"><span>Ships from and sold by Amazon.ca.</span></div>
<form method="get" action="/checkout/p/test-order/spc">
<select name="quantity" id="quantity"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
<input id="add-to-cart-button" type="button" value="Add to Cart" aria-label="Add to Cart">
<input id="buy-now-button" type="submit" value="Buy Now" aria-label="Buy Now">
</form>
<script>document.getElementById('buy-now-button').addEventListener('click',()=>sessionStorage.setItem('buyNow',document.getElementById('quantity').value))</script>
</body></html>
