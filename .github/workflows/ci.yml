name: Validate PokéFlip
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run check
      - name: Cloudflare Pages build and Functions bundle (no account needed)
        run: node tools/build-pages.mjs && npx --yes wrangler@4.20.0 pages functions build --outdir "$RUNNER_TEMP/pages-fn"
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash tests/db/run.sh
  browser-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/theme-layout.py
      - run: python tests/browser_embedded.py
      - run: python tests/cloud_autosave_browser.py
      - run: python tests/restock-auto-browser.py
      - run: python tests/restock-region-browser.py
      - run: python tests/live-browser.py
        env:
          POKEFLIP_URL: ${{ vars.CARDSTEAD_URL || 'https://pokeflip-studio.vercel.app/' }}
      - run: python tests/pack-ev-browser.py
      - run: python tests/alert-card-browser.py
      - run: python tests/compare-stores-browser.py
      - run: python tests/simplify-browser.py
      - run: python tests/phase2-browser.py
      - run: python tests/i18n-fr-browser.py
      - run: python tests/set-completion-browser.py
      - run: python tests/search-browser.py
      - run: python tests/area-stores-browser.py
      - run: python tests/ebay-deals-browser.py
      - run: python tests/extension-assist-browser.py
      - run: python tests/extension-auto-browser.py
      - run: python tests/csp-check.py
  deployed-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node tests/production-smoke.mjs
        env:
          POKEFLIP_URL: ${{ vars.CARDSTEAD_URL || 'https://pokeflip-studio.vercel.app/' }}
      - run: node tests/anon-access-smoke.mjs
