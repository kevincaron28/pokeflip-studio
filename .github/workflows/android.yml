name: Android
on:
  pull_request:
  push:
    tags: ['v*']
    branches: ['feat/android-**']   # build check while the Android wrapper is being finished; drop after merge
permissions:
  contents: read
jobs:
  debug-apk:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: mobile/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log" || { echo "::error title=Gradle failed::$(grep -E 'error|Error|FAILED|What went wrong|Caused by|not found|licen' -A2 "$RUNNER_TEMP/gradle.log" | head -40 | sed 's/%/%25/g' | tr '
' '|')"; exit 1; }
        env: { VERSION_CODE: '${{ github.run_number }}' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pokeflip-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  release-aab:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: { distribution: temurin, java-version: '21' }
      - name: Version from tag (v4.3.0 -> name 4.3.0, code 40300)
        run: |
          v="${GITHUB_REF_NAME#v}"; IFS=. read -r a b c <<<"${v%%-*}"
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((a*10000 + b*100 + c))" >> "$GITHUB_ENV"
      - name: Decode upload keystore
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          test -n "$KS" || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npx cap sync android
      - run: ./gradlew bundleRelease --no-daemon
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pokeflip-release-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
