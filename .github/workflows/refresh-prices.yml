name: Refresh prices
# Daily: rebuild the price snapshot (pack-ev-data.js: market values and pack EV inputs) and the price history
# (price-history.js: the graphs) from tcgcsv.com (TCGplayer prices and daily archives) and the Bank of Canada.
#
# When: 08:30 UTC = 03:30 in Québec in winter (04:30 in summer), a quiet hour, after tcgcsv.com's daily update
# (about 20:00 UTC) and the Bank of Canada rate (published about 16:30 Eastern on business days).
#
# Limits kept (see docs/plans/SIMPLIFY_2026-11.md, "Daily price refresh"):
#  - tcgcsv.com: one update a day, a custom User-Agent, at most ~10,000 requests a day, and never download an
#    archive twice. A run makes about 100 snapshot requests and downloads ONE new archive (~3-4 MB): the points
#    already in price-history.js are kept, archives never change.
#  - GitHub Actions: public repository, standard runner minutes are free; a run takes a few minutes.
#  - Size: price-history.js keeps one point per day for 35 days, then Mondays back to a year (about 340 KB, stable).
#
# Publishing: by default the run updates ONE pull request (branch data/price-refresh) for review, never main.
# Set the repository variable PRICE_REFRESH_PUBLISH=main to have a run that passes the checks commit straight to
# main instead (the site then deploys the new prices every morning with no click).
# Needs "Settings > Actions > General > Allow GitHub Actions to create and approve pull requests" for the pull
# request mode. Pull requests opened with GITHUB_TOKEN do not start CI by themselves: close and reopen it to run CI.
on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install py7zr==1.1.4
      - name: Rebuild the price snapshot (pack-ev-data.js)
        run: node tools/build-pack-ev.mjs
      - name: Rebuild the shop checker's catalogue and shop list
        run: node tools/build-drop-sources.mjs
      - name: Add today's point to the price history (price-history.js)
        run: python tools/build-price-history.py
      - name: Check the rebuilt data
        run: npm run check
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ vars.PRICE_REFRESH_PUBLISH }}
        run: |
          if git diff --quiet -- pack-ev-data.js price-history.js data/drop-catalogue.json supabase/functions/_shared/drop-shops.json; then echo "No change."; exit 0; fi
          day=$(date -u +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pack-ev-data.js price-history.js data/drop-catalogue.json supabase/functions/_shared/drop-shops.json
          git commit -m "Price data refresh $day (TCGplayer via tcgcsv, Bank of Canada)"
          if [ "$PUBLISH" = "main" ]; then git push origin HEAD:main; exit 0; fi
          branch="data/price-refresh"
          git push --force origin "HEAD:refs/heads/$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "Price data refresh (daily)" \
              --body "Daily automatic refresh of pack-ev-data.js and price-history.js (TCGplayer prices via tcgcsv.com, Bank of Canada USD/CAD and EUR/CAD). Data only. Each morning's run replaces this branch with the newest prices, so merging it on any day publishes that day's prices. Close and reopen to run CI, then merge if it is green."
          fi
